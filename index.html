<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dr. Hans-Jörg Gerdey | Persönliche Visitenkarte</title>
  <meta name="description" content="Persönliche Visitenkarte von Dr. Hans-Jörg Gerdey">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #dbe7f5;
      --card: #ffffff;
      --text: #0d2b4a;
      --muted: #3d5a80;
      --accent: #1a4a8a;
      --accent-dark: #123366;
      --soft: #c5d9f0;
      --shadow: 0 10px 40px rgba(13, 43, 74, 0.18);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Nunito', system-ui, sans-serif;
      background: linear-gradient(160deg, #c5d9f0 0%, #e8f0f8 50%, #b8cfe8 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      line-height: 1.6;
    }

    .card {
      background: var(--card);
      border-radius: 28px;
      box-shadow: var(--shadow);
      max-width: 480px;
      width: 100%;
      overflow: hidden;
      text-align: center;
      padding: 2.5rem 2rem 2rem;
    }

    .photo-wrap {
      width: 140px;
      height: 140px;
      margin: 0 auto 1.5rem;
      border-radius: 50%;
      overflow: hidden;
      border: 4px solid var(--soft);
      box-shadow: 0 8px 20px rgba(45, 42, 38, 0.1);
    }

    .photo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .photo-placeholder {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #d6eaf8, #aed6f1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      color: var(--accent-dark);
    }

    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 2rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
      letter-spacing: -0.02em;
    }

    .tagline {
      color: var(--muted);
      font-size: 1rem;
      margin-bottom: 1.5rem;
    }

    .bio {
      color: var(--text);
      font-size: 1.05rem;
      margin-bottom: 2rem;
      max-width: 42ch;
      margin-left: auto;
      margin-right: auto;
      font-style: italic;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
      margin-bottom: 1.5rem;
    }

    .link-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.7rem 1.2rem;
      background: var(--accent);
      color: white;
      text-decoration: none;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    .link-btn:hover {
      background: var(--accent-dark);
      transform: translateY(-2px);
    }

    .link-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .footer-note {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 1rem;
    }

    @media (max-width: 480px) {
      .card {
        padding: 2rem 1.25rem 1.5rem;
        border-radius: 20px;
      }
      h1 { font-size: 1.75rem; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="photo-wrap">
      <img src="Bali-2017.jpg" alt="Dr. Hans-Jörg Gerdey">
    </div>

    <h1>Dr. Hans-Jörg Gerdey</h1>
    <p class="tagline">Persönliche Visitenkarte</p>

    <p class="bio">
      Frei nach Schopenhauer: „Vom blinden Willen ins Dasein geprügelt, tapfer gelitten, die Mitmenschen für unerträglich befunden und werde bei Zeiten ins Nichts entfliehen.“
    </p>

    <div class="links">
      <a href="mailto:info@gerdey.de" class="link-btn">
        <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
        info@gerdey.de
      </a>
    </div>

    <p class="footer-note">Schöne Grüße von meiner digitalen Visitenkarte</p>
  </div>
</body>
</html>
